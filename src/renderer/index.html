<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>文件批量整理器</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>文件批量整理器</h1>
  <p class="safety">原文件不会被删除，也不会被移动 —— 全程只做复制。</p>

  <div id="drop" class="drop">
    把文件拖到这里<br />
    <span class="hint">（支持一次拖入多个文件；文件夹暂不支持）</span>
  </div>

  <div class="row">
    <button id="pick-files">选择文件</button>
    <span id="file-count">已选 0 个文件</span>
    <button id="clear-files">清空名单</button>
  </div>

  <div class="row">
    <button id="pick-out">选择输出文件夹</button>
    <span id="out-dir">未选择输出文件夹</span>
  </div>

  <div class="row">
    <button id="preview">预览（先看会怎么分）</button>
    <button id="start" class="primary">开始整理</button>
    <span id="progress">已处理 0 / 共 0</span>
    <button id="open-out">打开输出文件夹</button>
  </div>

  <p id="notice" class="notice"></p>

  <h2>预览</h2>
  <p id="preview-warning" class="preview-warning"></p>
  <p id="preview-summary" class="summary"></p>
  <div id="preview-tree" class="preview-tree"></div>

  <h2>处理结果</h2>
  <div id="file-list" class="list"></div>

  <h2>总结</h2>
  <p id="summary" class="summary">整理完成：成功 0 个，失败 0 个</p>

  <script src="renderer.js"></script>
</body>
</html>
